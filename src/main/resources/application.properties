# Se limita el tamaño individual y total de las cargas recibidas por Spring.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=9MB
# Se permite que AWS indique el puerto 5000 y se mantiene el puerto 8080 para ejecutar localmente.
server.port=${PORT:8080}
# Se configura SMTP mediante variables de entorno para no guardar secretos en el proyecto.
app.smtp.host=${SMTP_HOST:smtp.gmail.com}
app.smtp.port=${SMTP_PORT:587}
app.smtp.username=${SMTP_USERNAME:}
app.smtp.password=${SMTP_PASSWORD:}
app.smtp.from=${SMTP_FROM:${SMTP_USERNAME:}}
# Se deja un asunto configurable para los mensajes enviados.
app.email.subject=${EMAIL_SUBJECT:Archivos recibidos}
